name: Full Security Audit

on:
  pull_request:
  push:
    branches:
      - main
      - security/jwt-hardening

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Source security audit
        run: npm run security:audit

      - name: TypeScript check
        run: npm run lint

      - name: Existing security tests
        run: npm test

      - name: JWT hardening tests
        run: npm run test:jwt

      - name: Production build
        run: npm run build
