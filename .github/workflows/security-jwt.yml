name: JWT Security Verification

on:
  pull_request:
    paths:
      - 'server/middleware/auth.ts'
      - 'server/jwt-config.ts'
      - 'server/jwt-startup.ts'
      - 'test-jwt-hardening.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-jwt.yml'
  push:
    branches:
      - security/jwt-hardening

jobs:
  jwt-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Existing security tests
        run: npm test

      - name: JWT hardening tests
        run: npm run test:jwt

      - name: Production build
        run: npm run build
